<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NotaStudio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Pantalla de login (primer inicio) -->
  <section id="screen-login" class="screen">
    <div class="center-card">
      <img class="pug-logo" src="../assets/pug_icon.png" alt="NotaStudio">
      <h1 class="brand-title">NotaStudio</h1>
      <p id="loginSubtitle" class="subtitle"></p>
      <button id="btnLogin" class="btn btn-primary"></button>
      <p id="loginWaiting" class="hint hidden"></p>
    </div>
  </section>

  <!-- Pantalla principal -->
  <section id="screen-main" class="screen hidden">
    <div class="center-card">
      <h1 class="brand-title">NotaStudio</h1>
      <p id="welcomeText" class="subtitle"></p>
      <button id="btnUpload" class="btn btn-primary"></button>
    </div>
  </section>

  <!-- Pantalla de subida en progreso -->
  <section id="screen-uploading" class="screen hidden">
    <div class="center-card">
      <p id="uploadingText" class="subtitle"></p>
      <div class="progress-track">
        <div id="progressBar" class="progress-fill" style="width:0%"></div>
      </div>
      <p id="progressPercent" class="progress-percent">0%</p>
    </div>
  </section>

  <!-- Pantalla de éxito -->
  <section id="screen-success" class="screen hidden">
    <div class="center-card">
      <div class="success-icon">✓</div>
      <h2 id="successTitle" class="brand-title small"></h2>
      <div class="button-row">
        <button id="btnUploadAnother" class="btn btn-primary"></button>
        <button id="btnExitSuccess" class="btn btn-secondary"></button>
      </div>
      <label class="checkbox-row">
        <input type="checkbox" id="chkDeleteLoginSuccess">
        <span id="deleteLoginSuccessText"></span>
      </label>
    </div>
  </section>

  <!-- Pantalla de error -->
  <section id="screen-error" class="screen hidden">
    <div class="center-card">
      <div class="error-icon">!</div>
      <h2 id="errorTitle" class="brand-title small"></h2>
      <p id="errorSubtitle" class="subtitle"></p>
      <div class="button-row">
        <button id="btnRetry" class="btn btn-primary"></button>
        <button id="btnExitError" class="btn btn-secondary"></button>
      </div>
      <label class="checkbox-row">
        <input type="checkbox" id="chkDeleteLoginError">
        <span id="deleteLoginErrorText"></span>
      </label>
    </div>
  </section>

  <!-- Modal: nombre del proyecto -->
  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal-box">
      <h3 id="modalTitle" class="modal-title"></h3>
      <input type="text" id="modalInput" class="modal-input">
      <p id="modalWarning" class="modal-warning"></p>
      <div class="modal-actions">
        <button id="modalCancel" class="btn btn-text"></button>
        <button id="modalAccept" class="btn btn-primary"></button>
      </div>
    </div>
  </div>

  <!-- Selector de idioma -->
  <div class="lang-selector">
    <select id="langSelect"></select>
  </div>

  <script src="i18n.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
